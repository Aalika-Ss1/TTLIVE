services:
  postgres:
    image: postgres:16
    container_name: tournament-os-postgres
    environment:
      POSTGRES_DB: tournament_os
      POSTGRES_USER: tournament_os
      POSTGRES_PASSWORD: tournament_os
    ports:
      - "5433:5432"
    volumes:
      - tournament_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament_os -d tournament_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tournament_os_postgres_data:
