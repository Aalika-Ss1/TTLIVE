<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/admin_dashboard.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
    }
    .login-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .login-container h1 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .login-container p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      border-color: var(--accent-color);
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .submit-btn:hover {
      background: #e6b800; /* slightly darker gold */
    }
    .submit-btn:active {
      transform: translateY(2px);
    }
    .error-msg {
      background: rgba(231, 76, 60, 0.1);
      color: #e74c3c;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      border: 1px solid rgba(231, 76, 60, 0.2);
    }
    
    /* Fallback variables if admin_dashboard.css fails to load */
    :root {
      --bg-primary: #0a0a0c;
      --bg-surface: #121216;
      --text-primary: #ffffff;
      --text-secondary: #8f929a;
      --border-color: #27282e;
      --accent-color: #f1c40f;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Tournament OS</h1>
    <p>Admin Control Center</p>
    
    {% if error %}
    <div class="error-msg">
      ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/web/admin/login">
      {% if next_url %}
      <input type="hidden" name="next_url" value="{{ next_url }}">
      {% endif %}
      
      <div class="form-group">
        <label for="admin_token">Admin Token / Password</label>
        <input type="password" id="admin_token" name="admin_token" placeholder="Enter admin token..." required autofocus>
      </div>
      
      <button type="submit" class="submit-btn">Login</button>
    </form>
  </div>

</body>
</html>
